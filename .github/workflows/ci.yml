name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

jobs:
  build_test_package:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: app
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d app"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Install PostgreSQL client (for pg_isready)
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y postgresql-client

      - name: Restore keystore from GitHub Secret (base64 -> .p12)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci-secrets

          # Убираем любые пробелы/переносы/CR перед декодом (на всякий случай)
          printf '%s' "${{ secrets.KEYSTORE_P12_B64 }}" \
            | tr -d '\r\n ' \
            | base64 --decode > .ci-secrets/keystore.p12

          chmod 600 .ci-secrets/keystore.p12

          echo "Restored keystore:"
          ls -la .ci-secrets/keystore.p12
          # Должно быть "data" или "PKCS#12", но точно НЕ "ASCII text"
          file .ci-secrets/keystore.p12 || true

      - name: Verify keystore (must be PKCS12 and contain alias airline-tls)
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail

          # 1) Проверяем что keystore читается
          keytool -list -storetype PKCS12 \
            -keystore ".ci-secrets/keystore.p12" \
            -storepass "${KEYSTORE_PASSWORD}" >/dev/null

          # 2) Проверяем что alias существует
          keytool -list -storetype PKCS12 \
            -keystore ".ci-secrets/keystore.p12" \
            -storepass "${KEYSTORE_PASSWORD}" \
            | grep -E "airline-tls" >/dev/null

          echo "Keystore OK and alias airline-tls found."

      - name: Wait for Postgres to accept connections
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..30}; do
            if pg_isready -h localhost -p 5432 -U app -d app >/dev/null 2>&1; then
              echo "Postgres is ready"
              exit 0
            fi
            echo "Waiting for Postgres... ($i/30)"
            sleep 2
          done
          echo "Postgres did not become ready in time"
          exit 1

      - name: Compile
        run: mvn -q -DskipTests compile

      - name: Test
        env:
          # DB для тестов
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/app
          SPRING_DATASOURCE_USERNAME: app
          SPRING_DATASOURCE_PASSWORD: app

          # SSL параметры (оставляем, чтобы задание формально выполнялось)
          KEYSTORE_PATH: ${{ github.workspace }}/.ci-secrets/keystore.p12
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}

          # ВАЖНО: чтобы тесты не падали из-за HTTPS/сертификатов,
          # лучше отключить SSL на время unit/integration тестов.
          SERVER_SSL_ENABLED: "false"
        run: mvn -q test

      - name: Package (jar)
        run: mvn -q -DskipTests package

      - name: Upload artifact (jar)
        uses: actions/upload-artifact@v4
        with:
          name: maven-demo-${{ github.ref_name }}-${{ github.sha }}
          path: target/*.jar
